name: Test both databases

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentzuno
          POSTGRES_PASSWORD: agentzuno-ci-only
          POSTGRES_DB: agentzuno
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentzuno"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      TEST_POSTGRES_URL: postgresql://agentzuno:agentzuno-ci-only@127.0.0.1:5432/agentzuno
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm --prefix api ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:ui
      - run: npm --prefix api test
